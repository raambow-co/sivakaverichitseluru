<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3EEDB" />
      <stop offset="30%" stop-color="#D4AF57" />
      <stop offset="70%" stop-color="#B88E38" />
      <stop offset="100%" stop-color="#8C671C" />
    </linearGradient>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5342" />
      <stop offset="50%" stop-color="#0F382C" />
      <stop offset="100%" stop-color="#08221A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#8C671C" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ring with Traditional Dots -->
  <circle cx="50" cy="50" r="48" fill="url(#forestGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2, 2" />

  <!-- Inner Sacred Geometry / Kalasam Motif -->
  <!-- Base Lotus -->
  <path d="M 32 68 Q 50 63 68 68 Q 50 78 32 68 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Sacred Pot / Kumbham -->
  <path d="M 36 64 C 34 52 40 45 50 45 C 60 45 66 52 64 64 Z" fill="url(#goldGrad)" opacity="0.95" />
  
  <!-- Coconut & Mango Leaves -->
  <path d="M 40 46 C 42 38 48 35 50 25 C 52 35 58 38 60 46 C 54 44 46 44 40 46 Z" fill="url(#goldGrad)" />
  <path d="M 36 47 C 32 40 34 32 30 28 C 36 34 42 40 42 46 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 64 47 C 68 40 66 32 70 28 C 64 34 58 40 58 46 Z" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Divine Ray / Star -->
  <circle cx="50" cy="23" r="2.5" fill="#FFF" filter="url(#glow)" />

  <!-- Telugu Text Curve / Monogram "శివ కావేరి" -->
  <text x="50" y="86" font-family="'Noto Serif Telugu', Georgia, serif" font-size="8.5" font-weight="bold" fill="#F3EEDB" text-anchor="middle" letter-spacing="0.5">శివ కావేరి</text>
  <text x="50" y="58" font-family="'Cinzel', serif" font-size="9" font-weight="900" fill="#08221A" text-anchor="middle">SKC</text>
</svg>
